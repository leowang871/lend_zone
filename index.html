  /* ── BRAND PALETTE ─────────────────────────────────────────── */
  /* Pocket Securities is built on a coral-pink → crimson spectrum.

     The softer coral (#F95868 / #E95465) carries every primary
     button and selected-state in the CMS.                          */

  /* Tertiary purple — admin/system accents */
  --brand-violet:     rgb( 90,  41, 195);  /* #5A29C3 · pill chips */

/* 內容預覽：中大屏 */
@media (max-width: 1280px) {

  }

  .dtb-content-grid {

@media (max-width: 1024px) {
  .cms-shell {
    grid-template-columns: 1fr;
    grid-template-rows: 60px auto 1fr;
    grid-template-areas:
      "header"
      "side"
      "main";
  }

  .cms-menu-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .cms-header {
    padding-left: 16px;

    top: 60px;
    left: 0;
    bottom: 0;
    width: min(280px, 88vw);
    transform: translateX(-100%);
    transition: transform 0.2s ease;
    box-shadow: 2px 0 12px rgba(0, 0, 0, 0.12);
  }

  .cms-main {
    padding: 24px 16px 32px;
  }

  .dtb-content-group__grid--borrower,

  .dtb-channels {

  .dtb-section-tab {

  <script type="text/babel" data-cms="components">
// Pocket Securities CMS — Atomic components (button, input, card, table…)
// Loads after React and shell.jsx.

function Card({ children, padding = 40, style }) {

    <div style={{
      background: '#fff',

function PageTitle({ children, subtitle }) {

function Button({ children, variant = 'primary', size = 'large', disabled, onClick, style, type = 'button' }) {
  const sizes = {

    small: { height: 35, padding: '0 22px', fontSize: 15 },

  const palettes = {
    primary: {

      color: '#fff', border: 'none',
    },
    secondary: {
      background: '#fff',
      color: disabled ? PKT.blushSoft : PKT.coralDeep,
      border: `1px solid ${disabled ? PKT.blushSoft : PKT.coralDeep}`,
    },
    utility: {
      background: disabled ? PKT.borderStrong : PKT.blue,
      color: '#fff', border: 'none',
    },
    ghost: {
      background: 'transparent',
      color: PKT.coralDeep,
      border: 'none',
      textDecoration: 'underline',
    },
  };
  return (
    <button type={type} disabled={disabled} onClick={onClick} style={{
      ...sizes[size],
      ...palettes[variant],
      borderRadius: 8,
      fontFamily: '"PingFang TC", "Noto Sans TC", sans-serif',
      fontWeight: 500,
      lineHeight: 1,
      cursor: disabled ? 'not-allowed' : 'pointer',

function Input({ value, onChange, placeholder, disabled, error, type = 'text', style, width = 380 }) {

function Textarea({ value, onChange, placeholder, rows = 4, width = 540 }) {

    <textarea

function Checkbox({ checked, onChange, label, disabled = false }) {

    <label style={{
      display: 'inline-flex',

        width: 18,

}

function Radio({ checked, onChange, label, name }) {

function Switch({ on, onChange }) {

      width: 36, height: 20, borderRadius: 999,

function StatusPill({ status }) {
  const map = {
    approved: { bg: '#E4F3EB', fg: 'rgb(31,138,91)',  label: '已通過' },

function SearchInput({ value, onChange, placeholder = '搜尋' }) {

function Toolbar({ children }) {
  return (
    <div style={{
      display: 'flex',
      alignItems: 'center',
      gap: 12,
      flexWrap: 'wrap',
    }}>{children}</div>
  );
}

function normalizeSortValue(value) {
  if (value == null || value === '—') return '';
  const text = String(value).trim();
  const numeric = text.replace(/[,張%]/g, '');
  if (/^-?\d+(\.\d+)?$/.test(numeric)) return Number(numeric);
  return text;
}

function compareSortValues(a, b) {
  const av = normalizeSortValue(a);
  const bv = normalizeSortValue(b);
  if (typeof av === 'number' && typeof bv === 'number') return av - bv;
  return String(av).localeCompare(String(bv), 'zh-Hant', { numeric: true, sensitivity: 'base' });
}

function sortRowsBy(rows, sortState, columns = []) {
  if (!sortState?.key) return rows;
  const col = columns.find(c => c.key === sortState.key) || {};
  const dir = sortState.dir === 'desc' ? -1 : 1;
  return [...rows].sort((a, b) => {
    const av = col.sortValue ? col.sortValue(a) : a[sortState.key];
    const bv = col.sortValue ? col.sortValue(b) : b[sortState.key];
    return compareSortValues(av, bv) * dir;
  });
}

function toggleSortState(setter, key) {
  setter(s => (s.key === key
    ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' }
    : { key, dir: 'asc' }));
}

function SortHeader({ title, sortKey, sortState, onSort, className = 'dtb-sort' }) {
  const active = sortState?.key === sortKey;
  const dir = active ? sortState.dir : null;
  return (
    <button type="button" className={className} onClick={() => onSort(sortKey)} aria-label={`${title}排序`}>
      <span className={className + '__label'}>{title}</span>
      <span className={className + '__arrows'} aria-hidden="true">
        <span className={className + '__arrow' + (active && dir === 'asc' ? ' is-active' : '')}>▲</span>
        <span className={className + '__arrow' + (active && dir === 'desc' ? ' is-active' : '')}>▼</span>
      </span>
    </button>
  );
}

function Table({ columns, rows, onRowAction }) {
  const [sortState, setSortState] = React.useState({ key: columns[0]?.key, dir: 'asc' });
  const sortedRows = sortRowsBy(rows, sortState, columns);
  return (
    <div style={{ width: '100%', overflow: 'auto', maxHeight: 420 }}>
      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 15 }}>
        <thead>
          <tr>
            {columns.map((c, i) => (
              <th key={i} style={{
                textAlign: c.align ?? 'left',
                padding: '12px 16px',
                background: '#F7F7F7',
                fontWeight: 600,
                color: 'rgb(65,65,65)',
                fontSize: 13,
                borderBottom: '1px solid rgb(238,238,239)',
                whiteSpace: 'nowrap',
                position: 'sticky',
                top: 0,
                zIndex: 3,
              }}>
                {c.sortable === false || !c.title ? c.title : (
                  <SortHeader
                    title={c.title}
                    sortKey={c.key}
                    sortState={sortState}
                    onSort={key => toggleSortState(setSortState, key)}
                  />
                )}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {sortedRows.map((r, ri) => (
            <tr key={ri}>
              {columns.map((c, ci) => (
                <td key={ci} style={{
                  textAlign: c.align ?? 'left',
                  padding: '14px 16px',
                  borderBottom: '1px solid rgb(238,238,239)',
                  fontVariantNumeric: c.numeric ? 'tabular-nums' : 'normal',
                  fontFamily: c.numeric ? 'Inter, "PingFang TC", sans-serif' : undefined,
                  color: '#000',
                  whiteSpace: c.nowrap ? 'nowrap' : 'normal',
                }}>{c.render ? c.render(r, ri, onRowAction) : r[c.key]}</td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function Modal({ open, onClose, title, children, actions }) {
  if (!open) return null;
  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0,
      background: 'rgba(0,0,0,0.5)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      zIndex: 10,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        background: '#fff',
        borderRadius: 10,
        padding: '32px 32px 24px',
        minWidth: 420,
        maxWidth: 560,
        boxShadow: '0 8px 24px rgba(0,0,0,0.16)',
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16,
        fontFamily: '"PingFang TC", "Noto Sans TC", sans-serif',
      }}>
        {title && <div style={{ fontSize: 21, fontWeight: 600, color: '#000' }}>{title}</div>}
        <div style={{ fontSize: 15, color: 'rgb(65,65,65)', textAlign: 'center', lineHeight: 1.55 }}>{children}</div>
        {actions && <div style={{ display: 'flex', gap: 14, marginTop: 8 }}>{actions}</div>}
      </div>
    </div>
  );
}

function StatCard({ label, value, delta, hint }) {
  const up = delta && delta.startsWith('+');
  return (
    <Card padding={24} style={{ display: 'flex', flexDirection: 'column', gap: 6, minWidth: 200 }}>
      <span style={{ fontSize: 14, color: PKT.muted }}>{label}</span>
      <span style={{
        fontSize: 32, fontWeight: 700, color: '#000',
        fontFamily: 'Inter, "PingFang TC", sans-serif',

      }}>{value}</span>
      <div style={{ display: 'flex', gap: 8, alignItems: 'baseline' }}>
        {delta && (
          <span style={{
            fontSize: 13,

function Breadcrumb({ items }) {

    <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: PKT.muted, marginBottom: 12 }}>
      {items.map((t, i) => (
        <React.Fragment key={i}>
          <span style={{ color: i === items.length - 1 ? '#000' : PKT.muted, fontWeight: i === items.length - 1 ? 500 : 400 }}>{t}</span>
          {i < items.length - 1 && <span>›</span>}
        </React.Fragment>
      ))}
    </div>
  );
}

const TABLE_PAGE_SIZE = 10;

function getPaginationPages(current, total) {
  if (total <= 7) {
    return Array.from({ length: total }, (_, i) => i + 1);
  }
  let start = Math.max(1, current - 2);
  let end = Math.min(total, current + 2);
  if (current <= 3) {
    start = 1;
    end = 5;
  } else if (current >= total - 2) {
    start = total - 4;
    end = total;
  }
  const pages = [];
  for (let i = start; i <= end; i += 1) pages.push(i);
  return pages;
}

function paginateSlice(items, page, pageSize = TABLE_PAGE_SIZE) {
  const totalItems = items.length;
  const totalPages = Math.max(1, Math.ceil(totalItems / pageSize) || 1);
  const safePage = Math.min(Math.max(1, page), totalPages);
  const start = (safePage - 1) * pageSize;
  return {
    items: items.slice(start, start + pageSize),
    page: safePage,
    totalPages,
    totalItems,
  };
}

function TablePagination({ page, totalItems, pageSize = TABLE_PAGE_SIZE, onPageChange }) {
  const totalPages = Math.max(1, Math.ceil(totalItems / pageSize) || 1);
  if (totalPages <= 1) return null;
  const safePage = Math.min(Math.max(1, page), totalPages);
  const go = next => onPageChange(Math.min(totalPages, Math.max(1, next)));
  const pageNums = getPaginationPages(safePage, totalPages);

  return (
    <nav className="dtb-pagination" aria-label="分頁">
      <button
        type="button"
        className="dtb-pagination__btn"
        disabled={safePage <= 1}
        onClick={() => go(1)}
        aria-label="第一頁"
      >
        «
      </button>
      <button
        type="button"
        className="dtb-pagination__btn"
        disabled={safePage <= 1}
        onClick={() => go(safePage - 1)}
        aria-label="上一頁"
      >
        ‹
      </button>
      {pageNums.map(n => (
        <button
          key={n}
          type="button"
          className={'dtb-pagination__btn' + (n === safePage ? ' dtb-pagination__btn--active' : '')}
          onClick={() => go(n)}
          aria-current={n === safePage ? 'page' : undefined}
        >
          {n}
        </button>
      ))}
      <button
        type="button"
        className="dtb-pagination__btn"
        disabled={safePage >= totalPages}
        onClick={() => go(safePage + 1)}
        aria-label="下一頁"
      >
        ›
      </button>
      <button
        type="button"
        className="dtb-pagination__btn"
        disabled={safePage >= totalPages}
        onClick={() => go(totalPages)}
        aria-label="最後一頁"
      >
        »
      </button>
    </nav>
  );
}

  Table, Modal, StatCard, Breadcrumb, TablePagination, paginateSlice, TABLE_PAGE_SIZE,
});

function time24ToParts(value) {
  const [h, m] = (value || '00:00').split(':').map(Number);
  const pm = h >= 12;
  return {
    period: pm ? '下午' : '上午',
    hour: String((h % 12) || 12).padStart(2, '0'),
    minute: String(m).padStart(2, '0'),
  };
}

function partsToTime24(period, hour, minute) {
  let h = parseInt(hour, 10) % 12;
  if (period === '下午') h += 12;
  return `${String(h).padStart(2, '0')}:${String(parseInt(minute, 10)).padStart(2, '0')}`;
}

function TimePicker({ value, onChange }) {
  const [open, setOpen] = React.useState(false);
  const wrapRef = React.useRef(null);
  const [parts, setParts] = React.useState(() => time24ToParts(value));

  React.useEffect(() => {
    setParts(time24ToParts(value));
  }, [value]);

  React.useEffect(() => {
    if (!open) return undefined;
    const onDoc = e => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);

  const update = next => {
    setParts(next);
    onChange(partsToTime24(next.period, next.hour, next.minute));
  };

  const hours = Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, '0'));
  const minutes = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));
  const periods = ['下午', '上午'];

  const column = (items, selected, onSelect) => (
    <div className="dtb-time-picker__col">
      {items.map(item => (
        <button
          key={item}
          type="button"
          className={'dtb-time-picker__item' + (item === selected ? ' is-active' : '')}
          onClick={() => onSelect(item)}
        >
          {item}
        </button>
      ))}
    </div>
  );

  const label = `${parts.period} ${parts.hour} : ${parts.minute}`;

  return (
    <div className="dtb-time-picker" ref={wrapRef}>
      <button
        type="button"
        className="dtb-time-picker__trigger"
        onClick={() => setOpen(o => !o)}
        aria-expanded={open}
        aria-haspopup="listbox"
      >
        <span className="dtb-time-picker__value">{label}</span>
        <span className="dtb-time-picker__clock" aria-hidden="true">🕐</span>
      </button>
      {open && (
        <div className="dtb-time-picker__panel" role="listbox">
          {column(periods, parts.period, p => update({ ...parts, period: p }))}
          {column(hours, parts.hour, h => update({ ...parts, hour: h }))}
          {column(minutes, parts.minute, m => update({ ...parts, minute: m }))}
        </div>
      )}
    </div>
  );
}

function DatePicker({ value, onChange, placeholder = '請選擇日期' }) {
  const [open, setOpen] = React.useState(false);
  const wrapRef = React.useRef(null);
  const selectedDate = parseDiffRocDate(value);
  const [viewDate, setViewDate] = React.useState(() => selectedDate || new Date());

  React.useEffect(() => {
    if (selectedDate) setViewDate(selectedDate);
  }, [value]);

  React.useEffect(() => {
    if (!open) return undefined;
    const onDoc = e => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);

  const firstOfMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  const startDate = new Date(firstOfMonth);
  startDate.setDate(1 - firstOfMonth.getDay());
  const days = Array.from({ length: 42 }, (_, i) => {
    const d = new Date(startDate);
    d.setDate(startDate.getDate() + i);
    return d;
  });
  const sameDay = (a, b) => a && b && a.toDateString() === b.toDateString();
  const pickDate = date => {
    onChange(formatDiffRocDate(date));
    setOpen(false);
  };
  const moveMonth = months => setViewDate(d => addDiffMonths(d, months));
  const clearDate = () => {
    onChange('');
    setOpen(false);
  };
  const pickToday = () => pickDate(new Date());

  return (
    <div className="dtb-dt-picker" ref={wrapRef}>
      <div className="dtb-dt-picker__trigger-wrap">
        <input
          type="text"
          className="dtb-dt-picker__trigger dtb-diff-query__input"
          value={value || ''}
          placeholder={placeholder}
          readOnly
          onClick={() => setOpen(o => !o)}
        />
        <button
          type="button"
          className="dtb-dt-picker__icon"
          onClick={() => setOpen(o => !o)}
          aria-label="開啟日期選擇"
        >
          ▾
        </button>
      </div>
      {open && (
        <div className="dtb-dt-picker__panel">
          <div className="dtb-dt-picker__body">
            <div className="dtb-dt-picker__calendar">
              <div className="dtb-dt-picker__cal-head">
                <span>{viewDate.getFullYear()}年{String(viewDate.getMonth() + 1).padStart(2, '0')}月 ▾</span>
                <span>
                  <button type="button" className="dtb-dt-picker__nav" onClick={() => moveMonth(-1)} aria-label="上一個月">↑</button>
                  <button type="button" className="dtb-dt-picker__nav" onClick={() => moveMonth(1)} aria-label="下一個月">↓</button>
                </span>
              </div>
              <div className="dtb-dt-picker__weekdays">
                {['日', '一', '二', '三', '四', '五', '六'].map(d => (
                  <div key={d} className="dtb-dt-picker__weekday">{d}</div>
                ))}
              </div>
              <div className="dtb-dt-picker__days">
                {days.map(d => {
                  const muted = d.getMonth() !== viewDate.getMonth();
                  const selected = sameDay(d, selectedDate);
                  return (
                    <button
                      type="button"
                      key={d.toISOString()}
                      className={
                        'dtb-dt-picker__day'
                        + (muted ? ' is-muted' : '')
                        + (selected ? ' is-selected' : '')
                      }
                      onClick={() => pickDate(d)}
                    >
                      {d.getDate()}
                    </button>
                  );
                })}
              </div>
              <div className="dtb-dt-picker__cal-foot">
                <button type="button" className="dtb-dt-picker__link" onClick={clearDate}>清除</button>
                <button type="button" className="dtb-dt-picker__link" onClick={pickToday}>今天</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function formatTimeLabel(value) {
  const p = time24ToParts(value);
  return `${p.period} ${p.hour} : ${p.minute}`;
}

function formatContentTimesMeta(col) {
  const labels = normalizeContentTimes(col).map(formatTimeLabel);
  return `自動通知時間：${labels.join('、')}`;
}

function normalizeContentTimes(col) {
  if (Array.isArray(col.times) && col.times.length) return col.times.map(String);
  if (col.time) return [String(col.time)];
  return ['13:02'];
}

function nextDefaultTime(times) {
  if (!times.length) return '13:02';
  const [h, m] = times[times.length - 1].split(':').map(Number);
  let nh = h;
  let nm = m + 30;
  if (nm >= 60) {
    nm -= 60;
    nh = (nh + 1) % 24;
  }
  return `${String(nh).padStart(2, '0')}:${String(nm).padStart(2, '0')}`;
}

function EditTimesList({ times, onChange, maxTimes = Infinity }) {
  const list = Array.isArray(times) && times.length ? times : ['13:02'];
  const setTimes = next => onChange(next.length ? next : ['13:02']);
  const canAddTime = list.length < maxTimes;
  const updateAt = (index, value) => {
    const next = list.slice();
    next[index] = value;
    setTimes(next);
  };
  const removeAt = index => {
    if (list.length <= 1) return;
    setTimes(list.filter((_, i) => i !== index));
  };
  const addTime = () => {
    if (!canAddTime) return;
    setTimes([...list, nextDefaultTime(list)]);
  };
  return (
    <div className="dtb-edit-times">
      <div className="dtb-edit-times__list">
        {list.map((t, i) => (
          <div key={`${i}-${t}`} className="dtb-edit-times__row">
            <TimePicker value={t} onChange={v => updateAt(i, v)} />
            <button
              type="button"
              className="dtb-edit-times__remove"
              disabled={list.length <= 1}
              onClick={() => removeAt(i)}
            >
              刪除
            </button>
          </div>
        ))}
      </div>
      <button type="button" className="dtb-edit-times__add" onClick={addTime} disabled={!canAddTime}>
        <span className="dtb-edit-times__add-icon" aria-hidden="true">+</span>
        <span>新增時間點</span>
      </button>
    </div>
  );
}

const parseDiffRocDate = text => {
  const m = String(text || '').match(/(\d{2,3})[./-](\d{1,2})[./-](\d{1,2})/);
  if (!m) return null;
  return new Date(parseInt(m[1], 10) + 1911, parseInt(m[2], 10) - 1, parseInt(m[3], 10));
};

const formatDiffRocDate = date => {
  if (!date) return '';
  return `${date.getFullYear() - 1911}.${date.getMonth() + 1}.${date.getDate()}`;
};

const addDiffMonths = (date, months) => {
  const d = new Date(date);
  d.setMonth(d.getMonth() + months);
  return d;
};

const DIFF_FORM_RETAIN_FROM = new Date(2021, 11, 1);

const latestDiffFormDate = rows => {
  const dates = rows.map(r => parseDiffRocDate(r.diffDate)).filter(Boolean);
  if (!dates.length) return '';
  return formatDiffRocDate(new Date(Math.max(...dates.map(d => d.getTime()))));
};

const defaultDiffQuery = rows => {
  const endText = latestDiffFormDate(rows);
  const endDate = parseDiffRocDate(endText);
  const startDate = endDate ? new Date(Math.max(addDiffMonths(endDate, -3).getTime(), DIFF_FORM_RETAIN_FROM.getTime())) : null;
  return {
    diffDateStart: formatDiffRocDate(startDate),
    diffDateEnd: endText,
    account: '',
    name: '',
    stockCode: '',
    stockName: '',
  };
};

const SERP3A_AMOUNT_KEYS = SERP3A_EXPORT_KEYS.slice(8);
const SERP3A_CSV_RULE = '='.repeat(132);

const parseSerp3aAmount = v => {
  const s = String(v ?? '').replace(/,/g, '').trim();
  if (!s || s === '—') return 0;
  return Number(s) || 0;
};

const formatSerp3aAmount = n => {
  if (!n) return '0';
  const neg = n < 0;
  const formatted = Math.abs(n).toLocaleString('en-US');
  return neg ? `-${formatted}` : formatted;
};

const serp3aTotalsFromRows = rows => {
  const out = {};
  SERP3A_AMOUNT_KEYS.forEach(k => {
    if (rows.length === 1) {
      out[k] = rows[0][k] || '0';
      return;
    }
    const sum = rows.reduce((acc, r) => acc + parseSerp3aAmount(r[k]), 0);
    out[k] = formatSerp3aAmount(sum);
  });
  return out;
};

const serp3aMetaForRows = rows => {
  if (rows.length !== 1) return { ...SERP3A_META };
  const r = rows[0];
  return {
    ...SERP3A_META,
    calcDateFrom: r.calcDate,
    calcDateTo: r.calcDate,
    accountFrom: r.account,
    accountTo: r.account,
    category: r.category,
  };
};

const buildSerp3aCsvContent = (rows, metaPatch = {}) => {
  const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const m = { ...serp3aMetaForRows(rows), ...metaPatch };
  const metaLines = [
    `${m.orgLine} ${m.reportTitle} 製表日期 : ${m.printDate}`,
    `報表名稱 : ${m.reportName} 列印時間 : ${m.printTime}`,
    `機密等級 : ${m.secretLevel} 頁 數 : ${m.page}`,
    `資料區間－ 計算日期 : ${m.calcDateFrom} ～ ${m.calcDateTo} 公司碼 : ${m.companyCode} ${m.companyLabel} 客戶帳號 : ${m.accountFrom} ～ ${m.accountTo}`,
    `類別 : ${m.category} 是否依客戶帳號跳頁： ${m.pageBreakByAccount} 交割方式： ${m.settlementMode}`,
  ];
  const header = SERP3A_EXPORT_HEADERS.map(esc).join(',');
  const dataLines = rows.map(r =>
    SERP3A_EXPORT_KEYS.map(k => esc(r[k])).join(',')
  );
  const totals = serp3aTotalsFromRows(rows);
  const totalLine = [
    '', '', '', '', '', '', '', '小計 :',
    ...SERP3A_AMOUNT_KEYS.map(k => esc(totals[k])),
  ].join(',');
  const grandLine = [
    '', '', '', '', '', '', '', '總計 :',
    ...SERP3A_AMOUNT_KEYS.map(k => esc(totals[k])),
  ].join(',');
  return '\uFEFF' + [
    ...metaLines,
    SERP3A_CSV_RULE,
    header,
    SERP3A_CSV_RULE,
    ...dataLines,
    SERP3A_CSV_RULE,
    totalLine,
    grandLine,
    '主管： 覆核： 經辦：',
  ].join('\n');
};

const serp3aRowExportFilename = row => {
  const safe = s => String(s ?? '').replace(/[/\\?%*:|"<>]/g, '_').trim() || 'export';
  return `SERP3A 現股當沖戶券差應收付金額表_${safe(row.account)}_${safe(row.clientName)}.csv`;
};

const downloadTextFile = (content, filename) => {
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};

</script>
  <script type="text/babel">
    function App() {
      const [state, setState] = React.useState({
        loggedIn: true,
        route: 'ops/day-trading-buyback',
        modal: null,
        notice: null,
      });

      const navigate = id => setState(s => ({ ...s, route: id, notice: null }));

      if (!state.loggedIn) return <Login setState={setState}/>;

      const ScreenMap = {
        'home':         Dashboard,
        'review/open':  ReviewQueue,
        'review/happy': ReviewQueue,
        'ops/discount': CampaignList,
        'ops/upload':   UploadForm,
        'ops/day-trading-buyback': DayTradingBuyback,
        'push':         PushCompose,
      };
      const Screen = ScreenMap[state.route] ?? Dashboard;

      return (
        <div data-screen-label={`CMS · ${state.route}`}>
          <Shell active={state.route} onNavigate={navigate} onLogout={logout}>
            <Screen state={state} setState={setState}/>
          </Shell>

          <Modal
            open={state.modal === 'confirm-upload'}
            onClose={() => setState(s => ({ ...s, modal: null }))}
            title="確認送出？"
            actions={
              <>
                <Button variant="secondary" onClick={() => setState(s => ({ ...s, modal: null }))}>取消</Button>

              </>
            }
          >

          </Modal>

          <Modal
            open={state.modal === 'confirm-push'}
            onClose={() => setState(s => ({ ...s, modal: null }))}

            actions={
              <>
                <Button variant="secondary" onClick={() => setState(s => ({ ...s, modal: null }))}>取消</Button>
                <Button variant="primary" onClick={() => setState(s => ({ ...s, modal: null, route: 'home', notice: '推播已送至簽核流程。' }))}>確認送簽</Button>
              </>
            }
          >

          </Modal>

          <Modal

          </Modal>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
